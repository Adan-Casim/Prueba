
<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Industrial Manager</title>

  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>

  <style>
    :root {
      --bg: #f4f6fa;
      --card: #ffffff;
      --text: #182230;
      --muted: #667085;
      --primary: #2457d6;
      --border: #e3e7ef;
    }

    * { box-sizing: border-box; }

    body {
      margin: 0;
      font-family: Arial, sans-serif;
      background: var(--bg);
      color: var(--text);
    }

    header {
      background: #172554;
      color: white;
      padding: 20px 28px;
      display: flex;
      justify-content: space-between;
      align-items: center;
      gap: 16px;
    }

    header h1 { margin: 0; font-size: 22px; }

    main {
      max-width: 1200px;
      margin: auto;
      padding: 28px;
    }

    .card {
      background: var(--card);
      border: 1px solid var(--border);
      border-radius: 12px;
      padding: 22px;
      margin-bottom: 20px;
    }

    .login {
      max-width: 420px;
      margin: 70px auto;
    }

    input, button {
      font: inherit;
      padding: 12px;
      border-radius: 8px;
    }

    input {
      width: 100%;
      margin: 8px 0 14px;
      border: 1px solid #cbd5e1;
    }

    button {
      border: 0;
      cursor: pointer;
      background: var(--primary);
      color: white;
      font-weight: bold;
    }

    button:disabled {
      opacity: 0.6;
      cursor: wait;
    }

    .secondary { background: #475569; }

    .grid {
      display: grid;
      grid-template-columns: repeat(auto-fit, minmax(210px, 1fr));
      gap: 16px;
    }

    .metric {
      font-size: 30px;
      font-weight: bold;
      margin-top: 10px;
    }

    .muted { color: var(--muted); }

    .project {
      border: 1px solid var(--border);
      border-left: 6px solid #16a34a;
      border-radius: 10px;
      padding: 18px;
      margin: 14px 0;
      background: white;
    }

    .project.red { border-left-color: #dc2626; }
    .project.yellow { border-left-color: #d97706; }
    .project.green { border-left-color: #16a34a; }

    .status {
      display: inline-block;
      border-radius: 20px;
      padding: 6px 10px;
      font-size: 12px;
      font-weight: bold;
    }

    .red .status { background: #fee2e2; color: #991b1b; }
    .yellow .status { background: #fef3c7; color: #92400e; }
    .green .status { background: #dcfce7; color: #166534; }

    .progress {
      height: 9px;
      background: #e5e7eb;
      border-radius: 20px;
      overflow: hidden;
      margin-top: 10px;
    }

    .progress div {
      height: 100%;
      background: var(--primary);
    }

    .nav {
      display: flex;
      flex-wrap: wrap;
      gap: 10px;
      margin-bottom: 22px;
    }

    .nav button {
      background: #e2e8f0;
      color: #1e293b;
    }

    .nav button.active {
      background: var(--primary);
      color: white;
    }

    #message {
      margin-top: 12px;
      color: #b91c1c;
      overflow-wrap: anywhere;
    }

    [hidden] { display: none !important; }

     .mat-form { display: grid; grid-template-columns: repeat(auto-fit, minmax(240px, 1fr)); gap: 12px 18px; margin-top: 16px; }
    .mat-form label { display: block; font-weight: bold; font-size: 14px; }
    .mat-form input, .mat-form select { width: 100%; margin: 6px 0 0; padding: 12px; border: 1px solid #cbd5e1; border-radius: 8px; font: inherit; font-weight: normal; background: white; }
    .mat-form .full { grid-column: 1 / -1; }
    .mat-family { padding: 12px; border: 1px solid #cbd5e1; border-radius: 8px; font: inherit; background: white; }

    .mat-table { width: 100%; border-collapse: collapse; margin-top: 12px; }
    .mat-table th, .mat-table td {
      padding: 10px; border-bottom: 1px solid var(--border);
      text-align: left; vertical-align: top; white-space: nowrap;
    }
    .avail-pill {
      border: 0; border-radius: 999px; padding: 8px 14px;
      font: inherit; font-weight: bold; cursor: pointer;
    }
    .avail-pill[data-state="true"]  { background: rgba(22, 163, 74, 0.15); color: #166534; }
    .avail-pill[data-state="false"] { background: rgba(220, 38, 38, 0.15); color: #991b1b; }
    .avail-pill[data-state=""]      { background: rgba(100, 116, 139, 0.15); color: #475569; }
    .avail-pill:disabled { opacity: 0.5; cursor: not-allowed; }
 
    .mat-table th { border-bottom: 2px solid var(--border); }
    .mat-table input { width: 90px; margin: 0; padding: 8px; }
    .warn { color: #991b1b; font-weight: bold; }
    @media (max-width: 600px) {
      main { padding: 16px; }
      header { padding: 16px; }
    }
  </style>
</head>

<body>
  <header>
    <h1>Industrial Manager</h1>
    <button id="logoutBtn" class="secondary" hidden>
      Cerrar sesión
    </button>
  </header>

  <main>
    <section id="loginView" class="card login">
      <h2>Iniciar sesión</h2>
      <p class="muted">Ingresa con tu cuenta de la empresa.</p>

      <form id="loginForm">
        <label for="email">Correo electrónico</label>
        <input
          id="email"
          type="email"
          required
          autocomplete="username"
        />

        <label for="password">Contraseña</label>
        <input
          id="password"
          type="password"
          required
          autocomplete="current-password"
        />

        <button id="loginBtn" type="submit" style="width:100%">
          Entrar
        </button>
      </form>

      <p id="message" role="status" aria-live="polite"></p>
    </section>

    <section id="appView" hidden>
      <h2>Dashboard</h2>
      <p id="welcome" class="muted"></p>

      <div class="card">
        <h3>Mi perfil</h3>
        <p><strong>Nombre:</strong> <span id="employeeName">—</span></p>
        <p><strong>Puesto:</strong> <span id="employeeRole">—</span></p>
        <p><strong>Código:</strong> <span id="employeeCode">—</span></p>
        <p><strong>Correo:</strong> <span id="employeeEmail">—</span></p>
      </div>

      <nav class="nav" aria-label="Módulos">
        <button class="active" data-page="projects">Proyectos</button>
        <button data-page="drawings">Planos</button>
        <button data-page="materials">Materiales</button>
        <button data-page="movements">Movimientos</button>
        <button data-page="transport">Transporte</button>
        <button data-page="machinery">Maquinaria</button>
        <button data-page="employees">Empleados</button>
      </nav>

      <section id="projectsPage">
        <div class="grid">
          <div class="card">
            <div class="muted">Proyectos</div>
            <div id="totalProjects" class="metric">0</div>
          </div>

          <div class="card">
            <div class="muted">Atrasados</div>
            <div id="overdueProjects" class="metric">0</div>
          </div>

          <div class="card">
            <div class="muted">Requieren atención</div>
            <div id="warningProjects" class="metric">0</div>
          </div>

          <div class="card">
            <div class="muted">Al corriente</div>
            <div id="onTrackProjects" class="metric">0</div>
          </div>
        </div>

        <div class="card">
          <div style="display:flex;justify-content:space-between;
                      align-items:center;gap:12px;flex-wrap:wrap">
            <h3>Proyectos actuales</h3>
            <button id="refreshBtn">Actualizar</button>
          </div>

          <p id="projectMessage" class="muted">Cargando proyectos...</p>
          <div id="projectList"></div>
        </div>
      </section>

      <section id="otherPage" class="card" hidden>
        <h2 id="otherTitle"></h2>
        <p id="otherDescription" class="muted"></p>
        <p id="moduleMessage" class="muted"></p>
        <div id="moduleContent"></div>
      </section>
    </section>
  </main>

  <script>
    // 1. Configuración de Supabase.
    const SUPABASE_URL =
      "https://hyxhrlsutaanulvpycid.supabase.co";

    const SUPABASE_ANON_KEY = "sb_publishable_gCZisdiEzJsXdpmg1RZZ5Q_3-LYG4hg";

    const db = window.supabase.createClient(
      SUPABASE_URL,
      SUPABASE_ANON_KEY
    );

    const $ = (id) => document.getElementById(id);

    // Orden alfabético en español (ignora mayúsculas y acentos, entiende números)
    const collator = new Intl.Collator("es", { numeric: true, sensitivity: "base" });
 
    function sortBy(rows, ...keys) {
      return [...rows].sort((a, b) => {
        for (const k of keys) {
          const x = String(a[k] ?? "").trim();
          const y = String(b[k] ?? "").trim();
          if (!x && y) return 1;      // los vacíos van al final
          if (x && !y) return -1;
          const c = collator.compare(x, y);
          if (c !== 0) return c;
        }
        return 0;
      });
    }

    let currentUser = null;
    let currentEmployee = null;

    const moduleInfo = {
      drawings: {
        title: "Planos técnicos",
        description:
          "Aquí conectaremos los planos asociados a cada proyecto."
      },
      materials: {
        title: "Materiales para hornos",
        description:
          "Aquí conectaremos materiales, calidad, proveedores, precios y plazos."
      },
      movements: {
        title: "Movimientos",
        description: "Historial de entradas y salidas de material por obra."
      },
      transport: {
        title: "Transporte",
        description:
          "Aquí conectaremos las empresas de transporte, vehículos y tarifas."
      },
      machinery: {
        title: "Maquinaria pesada",
        description:
          "Aquí conectaremos maquinaria, proveedores, alquileres y proyectos."
      },
      employees: {
        title: "Empleados",
        description:
          "Aquí conectaremos los perfiles y departamentos autorizados."
      }
    };

    // 2. Mostrar la pantalla de login.
    function showLogin(message = "") {
      $("loginView").hidden = false;
      $("appView").hidden = true;
      $("logoutBtn").hidden = true;
      $("message").textContent = message;

      currentUser = null;
      currentEmployee = null;
    }

    // 3. Obtener el perfil del empleado autenticado.
    async function loadEmployeeProfile(userId) {
      const { data: employee, error } = await db
        .from("employees")
        .select(`
          id,
          auth_user_id,
          employee_code,
          first_name,
          last_name,
          email,
          job_title
        `)
        .eq("auth_user_id", userId)
        .maybeSingle();

      if (error) {
        throw new Error(
          "No se pudo consultar el perfil del empleado: " +
          error.message
        );
      }

      if (!employee) {
        throw new Error(
          "Tu cuenta inició sesión, pero no tiene un perfil " +
          "asociado en employees. Comprueba auth_user_id."
        );
      }

      return employee;
    }

    // 4. Mostrar el perfil y entrar al dashboard.
    function showApp(user, employee) {
      currentUser = user;
      currentEmployee = employee;

      const fullName = [
        employee.first_name,
        employee.last_name
      ].filter(Boolean).join(" ").trim();

      const displayName =
        fullName || user.email || "Empleado";

      $("welcome").textContent =
        "Bienvenido, " + displayName;

      $("employeeName").textContent = displayName;
      $("employeeRole").textContent =
        employee.job_title || "Por asignar";
      $("employeeCode").textContent =
        employee.employee_code || "Sin código";
      $("employeeEmail").textContent =
        employee.email || user.email || "Sin correo";

      $("loginView").hidden = true;
      $("appView").hidden = false;
      $("logoutBtn").hidden = false;
      $("message").textContent = "";
    }

    // 5. Cargar perfil y solo entonces abrir el dashboard.
    async function enterApplication(user) {
      try {
        const employee = await loadEmployeeProfile(user.id);

        showApp(user, employee);
        await loadProjects();
      } catch (error) {
        console.error("Error de perfil:", error);

        // Evitar dejar una sesión sin perfil en una pantalla
        // que parece haber iniciado correctamente.
        await db.auth.signOut();

        showLogin(error.message);
        throw error;
      }
    }

    // 6. Iniciar sesión.
    $("loginForm").addEventListener("submit", async (event) => {
      event.preventDefault();

      const button = $("loginBtn");
      button.disabled = true;
      $("message").textContent = "";

      try {
        const { data, error } = await db.auth.signInWithPassword({
          email: $("email").value.trim(),
          password: $("password").value
        });

        if (error) {
          throw error;
        }

        await enterApplication(data.user);
      } catch (error) {
        console.error("Error al iniciar sesión:", error);

        if (!currentUser) {
          showLogin("No se pudo iniciar sesión: " + error.message);
        }
      } finally {
        button.disabled = false;
      }
    });

    // 7. Cerrar sesión.
    $("logoutBtn").addEventListener("click", async () => {
      const button = $("logoutBtn");
      button.disabled = true;

      try {
        const { error } = await db.auth.signOut();

        if (error) {
          throw error;
        }

        showLogin();
        $("password").value = "";
      } catch (error) {
        alert("No se pudo cerrar sesión: " + error.message);
      } finally {
        button.disabled = false;
      }
    });

    // 8. Clasificar el estado del proyecto.
    function getProjectStatus(project, publishedUpdate) {
      const today = new Date();
      today.setHours(0, 0, 0, 0);

      const dueDate = project.due_date
        ? new Date(project.due_date + "T00:00:00")
        : null;

      const progress = Number(
        project.progress_percentage ?? 0
      );

      if (progress >= 100) {
        return { type: "green", label: "Completado" };
      }

      if (dueDate && dueDate < today) {
        return { type: "red", label: "Atrasado" };
      }

      const daysLeft = dueDate
        ? Math.round((dueDate - today) / 86400000)
        : Infinity;

      if (
        dueDate &&
        daysLeft >= 0 &&
        daysLeft <= 2 &&
        !publishedUpdate
      ) {
        return {
          type: "yellow",
          label: "Requiere atención"
        };
      }

      return { type: "green", label: "Al corriente" };
    }

    // 9. Cargar proyectos desde Supabase.
    async function loadProjects() {
      $("projectMessage").textContent = "Cargando proyectos...";
      $("projectList").replaceChildren();

      try {
        const { data: projects, error } = await db
          .from("projects")
          .select("*")
          .order("due_date", { ascending: true });

        if (error) throw error;

        const { data: updates, error: updatesError } = await db
          .from("project_updates")
          .select("project_id, published_at")
          .not("published_at", "is", null);

        if (updatesError) throw updatesError;

        const publishedProjectIds = new Set(
          updates.map(update => String(update.project_id))
        );

        const counts = { red: 0, yellow: 0, green: 0 };

        $("totalProjects").textContent = projects.length;

        if (projects.length === 0) {
          $("projectMessage").textContent =
            "No hay proyectos visibles para esta cuenta.";

          updateCounts(counts);
          return;
        }

        $("projectMessage").textContent = "";

        for (const project of sortBy(projects, "name")) {
          const isPublished = publishedProjectIds.has(
            String(project.id)
          );

          const status = getProjectStatus(
            project,
            isPublished
          );

          counts[status.type]++;

          const progress = Math.max(
            0,
            Math.min(
              100,
              Number(project.progress_percentage ?? 0)
            )
          );

          const article = document.createElement("article");
          article.className = "project " + status.type;

          const title = document.createElement("h3");
          title.textContent =
            project.name || "Proyecto sin nombre";

          const badge = document.createElement("span");
          badge.className = "status";
          badge.textContent = status.label;

          const description = document.createElement("p");
          description.className = "muted";
          description.textContent =
            project.description || "Sin descripción";

          const due = document.createElement("p");
          due.textContent =
            "Entrega: " + (project.due_date || "Sin fecha");

          const progressText = document.createElement("p");
          progressText.textContent = "Avance: " + progress + "%";

          const progressBar = document.createElement("div");
          progressBar.className = "progress";

          const progressFill = document.createElement("div");
          progressFill.style.width = progress + "%";

          progressBar.appendChild(progressFill);

          article.append(
            title,
            badge,
            description,
            due,
            progressText,
            progressBar
          );

          $("projectList").appendChild(article);
        }

        updateCounts(counts);
      } catch (error) {
        console.error("Error al cargar proyectos:", error);
        $("projectMessage").textContent =
          "Error al consultar proyectos: " + error.message;
      }
    }

    function updateCounts(counts) {
      $("overdueProjects").textContent = counts.red;
      $("warningProjects").textContent = counts.yellow;
      $("onTrackProjects").textContent = counts.green;
    }

    $("refreshBtn").addEventListener("click", loadProjects);

    // 10. Navegación entre módulos.
    
    // 10. Mostrar tablas de los módulos.

    // Crear una tabla HTML a partir de los registros recibidos.
    function renderModuleTable(data, columns) {
      const table = document.createElement("table");
      table.style.width = "100%";
      table.style.borderCollapse = "collapse";
      table.style.marginTop = "16px";

      const thead = document.createElement("thead");
      const headerRow = document.createElement("tr");

      columns.forEach(column => {
        const th = document.createElement("th");
        th.textContent = column.label;
        th.style.textAlign = "left";
        th.style.padding = "12px";
        th.style.borderBottom = "2px solid #e3e7ef";
        headerRow.appendChild(th);
      });

      thead.appendChild(headerRow);
      table.appendChild(thead);

      const tbody = document.createElement("tbody");

      data.forEach(record => {
        const row = document.createElement("tr");

        columns.forEach(column => {
          const td = document.createElement("td");
          const value = record[column.key];

          td.textContent = value == null
            ? "—"
            : typeof value === "object"
              ? JSON.stringify(value)
              : String(value);

          td.style.padding = "12px";
          td.style.borderBottom = "1px solid #e3e7ef";
          td.style.verticalAlign = "top";
          row.appendChild(td);
        });
        tbody.appendChild(row);
      });

      table.appendChild(tbody);

      const wrapper = document.createElement("div");
      wrapper.style.overflowX = "auto";
      wrapper.appendChild(table);
      $("moduleContent").appendChild(wrapper);
    }

    // Cargar maquinaria con sus columnas principales.
   let machineryRows = [];
 
    function machAvailLabel(v) {
      return v === true ? "Disponible" : v === false ? "No disponible" : "Sin definir";
    }
 
    async function loadMachinery() {
      const message = $("moduleMessage");
      const content = $("moduleContent");
 
      message.textContent = "Cargando maquinaria...";
      content.replaceChildren();
 
      try {
        const { data, error } = await db
          .from("machinery")
          .select("*")
          .order("machinery_code", { ascending: true });
 
        if (error) throw error;
 
        if (!data || data.length === 0) {
          message.textContent = "No hay maquinaria registrada.";
          return;
        }
 
        machineryRows = sortBy(data, "name", "machinery_code");
        message.textContent = "";
        renderMachinery();
      } catch (error) {
        console.error("Error al cargar maquinaria:", error);
        message.textContent =
          "No se pudo cargar la maquinaria: " + error.message;
      }
    }
 
    // Crea el selector de disponibilidad y el campo de ubicación de una máquina.
    function buildMachineryControls(m) {
      const sel = document.createElement("select");
      sel.className = "avail-pill";
      [["", "Sin definir"], ["true", "Disponible"], ["false", "No disponible"]]
        .forEach(([v, t]) => {
          const o = document.createElement("option");
          o.value = v;
          o.textContent = t;
          sel.appendChild(o);
        });
 
      const loc = document.createElement("input");
      loc.type = "text";
      loc.placeholder = "¿Dónde está ahora mismo?";
      loc.value = m.current_location || "";
      loc.style.cssText = "margin:0;min-width:220px;";
 
      // Sin ubicación escrita, la disponibilidad queda bloqueada.
      const paint = () => {
        sel.value = m.is_available === true ? "true"
                  : m.is_available === false ? "false" : "";
        sel.dataset.state = sel.value;
        sel.disabled = !loc.value.trim();
        sel.title = sel.disabled ? "Escribe primero dónde está la máquina" : "";
      };
 
      loc.addEventListener("input", paint);
 
      // Guardar la ubicación al salir del campo (o pulsar Enter)
      loc.addEventListener("change", async () => {
        const place = loc.value.trim();
        if (!place) { paint(); return; }                 // no se guarda vacía
        if (place === (m.current_location || "")) return;
 
        loc.disabled = true;
        const { error } = await db.from("machinery")
          .update({ current_location: place }).eq("id", m.id);
        loc.disabled = false;
 
        if (error) {
          alert("No se pudo guardar la ubicación: " + error.message);
          loc.value = m.current_location || "";
        } else {
          m.current_location = place;
        }
        paint();
      });
 
      // Guardar disponibilidad + ubicación actual en un solo movimiento
      sel.addEventListener("change", async () => {
        const place = loc.value.trim();
        if (!place) { paint(); return; }
 
        const value = sel.value === "" ? null : sel.value === "true";
        sel.disabled = true;
 
        const { error } = await db.from("machinery")
          .update({ is_available: value, current_location: place })
          .eq("id", m.id);
 
        if (error) {
          alert("No se pudo guardar la disponibilidad: " + error.message);
        } else {
          m.is_available = value;
          m.current_location = place;
        }
        paint();
      });
 
      paint();
      return [sel, loc];
    }
 
    // Dibuja el buscador y la tabla de maquinaria.
    function renderMachinery() {
      const content = $("moduleContent");
      content.replaceChildren();
 
      const search = document.createElement("input");
      search.type = "search";
      search.placeholder = "Filtrar por código, nombre, categoría, marca, ubicación...";
      search.style.cssText = "max-width:460px;margin:0 0 8px;";
 
      const count = document.createElement("p");
      count.className = "muted";
 
      const holder = document.createElement("div");
      content.append(search, count, holder);
 
      const draw = () => {
        const terms = foldTxt(search.value).split(/\s+/).filter(Boolean);
 
        const shown = machineryRows.filter(m => {
          const hay = foldTxt([
            m.machinery_code, m.name, m.category, m.brand,
            m.current_location, machAvailLabel(m.is_available)
          ].join(" "));
          return terms.every(t => hay.includes(t));
        });
 
        count.textContent = "Mostrando " + shown.length + " de " + machineryRows.length;
        holder.replaceChildren();
 
        if (shown.length === 0) {
          holder.textContent = "Ninguna máquina coincide con el filtro.";
          return;
        }
 
        holder.appendChild(makeTable(

const DRAW_EXT = ["pdf", "dwg", "dxf", "png", "jpg", "jpeg", "xlsx", "docx"];
    const DRAW_MAX = 50 * 1024 * 1024;   // 50 MB

    async function loadDrawings() {
      const content = $("moduleContent");
      $("moduleMessage").textContent = "";
      content.replaceChildren();
 
      // ----- Formulario de subida -----
      const form = document.createElement("form");
      form.className = "mat-form";
 
      const field = (label, el, required) => {
        const l = document.createElement("label");
        l.textContent = label + (required ? " *" : "");
        el.required = !!required;
        l.appendChild(el);
        form.appendChild(l);
        return el;
      };
 
      const titleIn = field("Título del plano",
        Object.assign(document.createElement("input"), { type: "text" }), true);
      const descIn = field("Descripción",
        Object.assign(document.createElement("input"), { type: "text" }));
      const fileIn = field("Archivo",
        Object.assign(document.createElement("input"), {
          type: "file", accept: "." + DRAW_EXT.join(",.")
        }), true);
 
      const btn = document.createElement("button");
      btn.type = "submit";
      btn.textContent = "Subir plano";
      const status = document.createElement("p");
      status.setAttribute("role", "status");
      const foot = document.createElement("div");
      foot.className = "full";
      foot.append(btn, status);
      form.appendChild(foot);
 
      const heading = document.createElement("h3");
      heading.textContent = "Planos guardados";
      heading.style.marginTop = "28px";
      const list = document.createElement("div");
 
      content.append(form, heading, list);
 
      // ----- Lista de planos -----
      async function refresh() {
        list.textContent = "Cargando planos...";
        const { data, error } = await db
          .from("drawing_files")
          .select("*")
          .order("uploaded_at", { ascending: false });
 
        if (error) {
          list.textContent = "No se pudieron cargar los planos: " + error.message;
          return;
        }
        if (!data || data.length === 0) {
          list.textContent = "Aún no hay planos subidos.";
          return;
        }
 
        list.replaceChildren(makeTable(
          ["Título", "Descripción", "Archivo", "Tamaño", "Subido", ""],
          sortBy(data, "title").map(d => {
            const open = document.createElement("button");
            open.type = "button";
            open.textContent = "Abrir";
            open.addEventListener("click", async () => {
              // Se abre la pestaña antes del await para que no la bloquee el navegador
              const w = window.open("about:blank", "_blank");
              const { data: signed, error: err } = await db.storage
                .from("planos").createSignedUrl(d.file_path, 120);
              if (err) {
                if (w) w.close();
                alert("No se pudo abrir el archivo: " + err.message);
                return;
              }
              if (w) w.location.href = signed.signedUrl;
              else window.open(signed.signedUrl, "_blank");
            });
 
            return [
              d.title, d.description, d.file_name,
              d.size_bytes ? fmtSize(d.size_bytes) : "—",
              new Date(d.uploaded_at).toLocaleString("es-ES"),
              open
            ];
          })
        ));
      }
 
      // ----- Subir archivo -----
      form.addEventListener("submit", async (event) => {
        event.preventDefault();
        status.style.color = "#b91c1c";
        status.textContent = "";
 
        const file = fileIn.files[0];
        if (!file) return;
 
        const ext = (file.name.split(".").pop() || "").toLowerCase();
        if (!DRAW_EXT.includes(ext)) {
          status.textContent = "Formato no permitido. Usa: " + DRAW_EXT.join(", ") + ".";
          return;
        }
        if (file.size > DRAW_MAX) {
          status.textContent = "El archivo supera los 50 MB.";
          return;
        }
 
        btn.disabled = true;
        status.style.color = "#667085";
        status.textContent = "Subiendo...";
 
        // Nombre interno único: evita choques y caracteres raros. El nombre original se guarda aparte.
        const path = crypto.randomUUID() + "." + ext;
 
        try {
          const up = await db.storage.from("planos").upload(path, file, {
            contentType: file.type || "application/octet-stream",
            upsert: false
          });
          if (up.error) throw up.error;
 
          const ins = await db.from("drawing_files").insert({
            title: titleIn.value.trim(),
            description: descIn.value.trim() || null,
            file_path: path,
            file_name: file.name,
            mime_type: file.type || null,
            size_bytes: file.size
          });
 
          if (ins.error) {
            // Si falla el registro, se borra el archivo para no dejar huérfanos
            await db.storage.from("planos").remove([path]);
            throw ins.error;
          }
 
          status.style.color = "#166534";
          status.textContent = "Plano subido correctamente.";
          form.reset();
          await refresh();
        } catch (error) {
          console.error("Error al subir el plano:", error);
          status.style.color = "#b91c1c";
          status.textContent = "No se pudo subir: " + error.message;
        } finally {
          btn.disabled = false;
        }
      });
 
      await refresh();
    }

    // Selección del usuario: clave "familia:id" -> {family, code, name, qty, unit}
    const matSel = new Map();
 
    function monthsSince(dateStr) {
      if (!dateStr) return null;
      const a = new Date(dateStr + "T00:00:00"), n = new Date();
      return (n.getFullYear() - a.getFullYear()) * 12 +
             (n.getMonth() - a.getMonth()) - (n.getDate() < a.getDate() ? 1 : 0);
    }
 
    // Tabla genérica: cada celda puede ser texto o un nodo (por ejemplo un input).
    function makeTable(headers, rows) {
      const table = document.createElement("table");
      table.className = "mat-table";
      const hr = document.createElement("tr");
      headers.forEach(h => {
        const th = document.createElement("th");
        th.textContent = h;
        hr.appendChild(th);
      });
      const thead = document.createElement("thead");
      thead.appendChild(hr);
      const tbody = document.createElement("tbody");
      rows.forEach(cells => {
        const tr = document.createElement("tr");
        cells.forEach(v => {
          const td = document.createElement("td");
          if (v instanceof Node) td.appendChild(v);
          else td.textContent = v == null ? "—" : String(v);
          tr.appendChild(td);
        });
        tbody.appendChild(tr);
      });
      table.append(thead, tbody);
      const wrap = document.createElement("div");
      wrap.style.overflowX = "auto";
      wrap.appendChild(table);
      return wrap;
    }
 
    // Texto de búsqueda recordado por subpestaña
    const matSearch = {};
 
    // Minúsculas y sin acentos: "Hormigon" encuentra "Hormigón"
    const foldTxt = s => String(s ?? "")
      .normalize("NFD").replace(/[\u0300-\u036f]/g, "").toLowerCase();
 
    function renderMatTable(key) {
      const f = MAT[key], body = $("matBody");
      body.replaceChildren();
 
      if (!f.rows.length) {
        body.textContent = "No hay registros en " + f.table + ".";
        return;
      }
 
      // Construye una fila (celdas + campo "Cantidad a usar")
      const buildRow = (r) => {
        const id = key + ":" + r.id;
        const cells = f.cols.map(([k]) => {
          if (k === "status" && r.status === "REVISAR") {
            const s = document.createElement("span");
            s.className = "warn";
            s.textContent = "REVISAR";
            return s;
          }
          return r[k];
        });
 
        const inp = document.createElement("input");
        inp.type = "number";
        inp.min = "0";
        inp.max = String(f.avail(r) ?? 0);
        inp.step = "any";
        inp.value = matSel.has(id) ? matSel.get(id).qty : "";
        inp.addEventListener("input", () => {
          let v = Number(inp.value);
          if (!(v > 0)) { matSel.delete(id); return; }
          const max = Number(f.avail(r)) || 0;
          if (v > max) { v = max; inp.value = max; }   // no pasar de lo disponible
          if (v === 0) { matSel.delete(id); return; }
          matSel.set(id, {
            family: key, id: r.id, code: r.pr_code, name: f.name(r),
            qty: v, unit: r.unit || "ud", lot: matSel.get(id)?.lot || ""
          });
        });
        cells.push(inp);
        return cells;
      };
 
      // Buscador (se crea una sola vez para no perder el foco al escribir)
      const search = document.createElement("input");
      search.type = "search";
      search.placeholder = "Filtrar por código, nombre, tipo, fabricante...";
      search.value = matSearch[key] || "";
      search.style.cssText = "max-width:420px;margin:0 0 8px;";
 
      const count = document.createElement("p");
      count.className = "muted";
 
      const holder = document.createElement("div");
      body.append(search, count, holder);
 
      const headers = [...f.cols.map(c => c[1]), "Cantidad a usar"];
 
      // Filtra: todas las palabras escritas deben aparecer en alguna columna
      const draw = () => {
        const terms = foldTxt(search.value).split(/\s+/).filter(Boolean);
        const shown = f.rows.filter(r => {
          const hay = foldTxt(f.cols.map(([k]) => r[k]).join(" "));
          return terms.every(t => hay.includes(t));
        });
 
        count.textContent = "Mostrando " + shown.length + " de " + f.rows.length;
        holder.replaceChildren();
 
        if (shown.length === 0) {
          holder.textContent = "Ningún material coincide con el filtro.";
          return;
        }
        holder.appendChild(makeTable(headers, shown.map(buildRow)));
      };
 
      search.addEventListener("input", () => {
        matSearch[key] = search.value;
        draw();
      });
 
      draw();
    }

        const lab = document.createElement("label");
        lab.textContent = label + (required ? " *" : "");
        let el;
        if (type === "select") {
          el = document.createElement("select");
          ["OK", "REVISAR"].forEach(v => {
            const o = document.createElement("option");
            o.value = o.textContent = v;
            el.appendChild(o);
          });
        } else {
          el = document.createElement("input");
          el.type = type;
          if (type === "number") { el.min = "0"; el.step = "any"; }
        }
        el.required = !!required;
        inputs[key] = el;
        lab.appendChild(el);
        form.appendChild(lab);
      });
 
      const btn = document.createElement("button");
      btn.type = "submit";
      btn.textContent = "Guardar material";
      const msg = document.createElement("p");
      msg.setAttribute("role", "status");
      msg.className = "full";
      const foot = document.createElement("div");
      foot.className = "full";
      foot.append(btn, msg);
      form.appendChild(foot);
 
      form.addEventListener("submit", async (event) => {
        event.preventDefault();
        btn.disabled = true;
        msg.style.color = "#b91c1c";
        msg.textContent = "";
 
        try {
          // Armar la fila (vacío => null)
          const row = {};
          cfg.fields.forEach(([key, , type]) => {
            const v = inputs[key].value.trim();
            row[key] = v === "" ? null : (type === "number" ? Number(v) : v);
          });
 
          // Obligatorios (evita textos con solo espacios)
          cfg.fields.forEach(([key, label, , required]) => {
            if (required && row[key] == null) throw new Error("Falta el campo: " + label);
          });
 
          // Valores razonables
          if ("available" in row && row.available == null) row.available = row.quantity;
          if ("available" in row && row.available > row.quantity) {
            throw new Error("Lo disponible no puede ser mayor que la cantidad.");
          }
          if ("reserved" in row && row.reserved == null) row.reserved = 0;
          if ("reserved" in row && row.reserved > row.quantity) {
            throw new Error("Los reservados no pueden ser mayores que la cantidad.");
          }
 
          // Duplicados: aviso amable antes de enviar
          for (const [k, f] of Object.entries(MAT)) {
            if (f.rows.some(r => normTxt(r.pr_code) === normTxt(row.pr_code))) {
              throw new Error("El código PR \"" + row.pr_code + "\" ya existe en " + f.label + ".");
            }
          }
          if (fam.rows.some(r => normTxt(r[cfg.nameKey]) === normTxt(row[cfg.nameKey]))) {
            throw new Error("Ya existe un material llamado \"" + row[cfg.nameKey] + "\" en " + fam.label + ".");
          }
 
          // Guardar en Supabase
          const { data, error } = await db.from(fam.table).insert(row).select().single();
 
          if (error) {
            // 23505 = violación de unicidad (la base de datos es la protección final)
            if (error.code === "23505") {
              throw new Error("Ese código PR o nombre ya existe en la base de datos.");
            }
            throw error;
          }
 
          fam.rows = sortBy(
            [...fam.rows, prepMatRow(family, data)],
            cfg.nameKey, "pr_code"
          );
          msg.style.color = "#166534";
          msg.textContent = "Material guardado correctamente.";
          form.reset();
        } catch (error) {
          console.error("Error al agregar material:", error);
          msg.textContent = error.message;
        } finally {
          btn.disabled = false;
        }
      });
 
      body.append(title, sel, form);
    }

        const { data: sessionData, error: sessionError } =
          await db.auth.getSession();

        if (sessionError) {

        } else {

          );
        }

          "employees",
          "projects",
          "project_updates",
          "drawings",
          "materials",
          "machinery"
        ];

        for (const tabla of tablas) {
          console.group("Tabla: " + tabla);

          try {
            const { data, error, count } = await db
              .from(tabla)
              .select("*", { count: "exact" })
              .limit(1);

            if (error) {
              console.error("❌ Error al consultar");
              console.error("Código:", error.code);
              console.error("Mensaje:", error.message);
              console.error("Detalles:", error.details);
              console.error("Sugerencia:", error.hint);

              console.log("Total visible:", count);
              console.log("Datos de ejemplo:", data);
            }
          } catch (error) {
            console.error("Error inesperado:", error);
          }

          console.groupEnd();
        }
      } catch (error) {
        console.error("Falló el diagnóstico:", error);
      }

      console.groupEnd();
    }

    // Ejecutar el diagnóstico al iniciar la página.
