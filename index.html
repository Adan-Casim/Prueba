
<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Industrial Manager</title>

  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>

  <style>
    :root {
      --bg: #f4f6fa;
      --card: #ffffff;
      --text: #182230;
      --muted: #667085;
      --primary: #2457d6;
      --border: #e3e7ef;
    }

    * { box-sizing: border-box; }

    body {
      margin: 0;
      font-family: Arial, sans-serif;
      background: var(--bg);
      color: var(--text);
    }

    header {
      background: #172554;
      color: white;
      padding: 20px 28px;
      display: flex;
      justify-content: space-between;
      align-items: center;
      gap: 16px;
    }

    header h1 { margin: 0; font-size: 22px; }

    main {
      max-width: 1200px;
      margin: auto;
      padding: 28px;
    }

    .card {
      background: var(--card);
      border: 1px solid var(--border);
      border-radius: 12px;
      padding: 22px;
      margin-bottom: 20px;
    }

    .login {
      max-width: 420px;
      margin: 70px auto;
    }

    input, button {
      font: inherit;
      padding: 12px;
      border-radius: 8px;
    }

    input {
      width: 100%;
      margin: 8px 0 14px;
      border: 1px solid #cbd5e1;
    }

    button {
      border: 0;
      cursor: pointer;
      background: var(--primary);
      color: white;
      font-weight: bold;
    }

    button:disabled {
      opacity: 0.6;
      cursor: wait;
    }

    .secondary { background: #475569; }

    .grid {
      display: grid;
      grid-template-columns: repeat(auto-fit, minmax(210px, 1fr));
      gap: 16px;
    }

    .metric {
      font-size: 30px;
      font-weight: bold;
      margin-top: 10px;
    }

    .muted { color: var(--muted); }

    .project {
      border: 1px solid var(--border);
      border-left: 6px solid #16a34a;
      border-radius: 10px;
      padding: 18px;
      margin: 14px 0;
      background: white;
    }

    .project.red { border-left-color: #dc2626; }
    .project.yellow { border-left-color: #d97706; }
    .project.green { border-left-color: #16a34a; }

    .status {
      display: inline-block;
      border-radius: 20px;
      padding: 6px 10px;
      font-size: 12px;
      font-weight: bold;
    }

    .red .status { background: #fee2e2; color: #991b1b; }
    .yellow .status { background: #fef3c7; color: #92400e; }
    .green .status { background: #dcfce7; color: #166534; }

    .progress {
      height: 9px;
      background: #e5e7eb;
      border-radius: 20px;
      overflow: hidden;
      margin-top: 10px;
    }

    .progress div {
      height: 100%;
      background: var(--primary);
    }

    .nav {
      display: flex;
      flex-wrap: wrap;
      gap: 10px;
      margin-bottom: 22px;
    }

    .nav button {
      background: #e2e8f0;
      color: #1e293b;
    }

    .nav button.active {
      background: var(--primary);
      color: white;
    }

    #message {
      margin-top: 12px;
      color: #b91c1c;
      overflow-wrap: anywhere;
    }

    [hidden] { display: none !important; }

     .mat-form { display: grid; grid-template-columns: repeat(auto-fit, minmax(240px, 1fr)); gap: 12px 18px; margin-top: 16px; }
    .mat-form label { display: block; font-weight: bold; font-size: 14px; }
    .mat-form input, .mat-form select { width: 100%; margin: 6px 0 0; padding: 12px; border: 1px solid #cbd5e1; border-radius: 8px; font: inherit; font-weight: normal; background: white; }
    .mat-form .full { grid-column: 1 / -1; }
    .mat-form textarea {
      width: 100%; margin: 6px 0 0; padding: 12px; min-height: 90px;
      border: 1px solid #cbd5e1; border-radius: 8px;
      font: inherit; font-weight: normal; resize: vertical;
    }
    .mat-family { padding: 12px; border: 1px solid #cbd5e1; border-radius: 8px; font: inherit; background: white; }

    .mat-table { width: 100%; border-collapse: collapse; margin-top: 12px; }
    .mat-table th, .mat-table td {
      padding: 10px; border-bottom: 1px solid var(--border);
      text-align: left; vertical-align: top; white-space: nowrap;
    }
    .avail-pill {
      border: 0; border-radius: 999px; padding: 8px 14px;
      font: inherit; font-weight: bold; cursor: pointer;
    }
    .avail-pill[data-state="true"]  { background: rgba(22, 163, 74, 0.15); color: #166534; }
    .avail-pill[data-state="false"] { background: rgba(220, 38, 38, 0.15); color: #991b1b; }
    .avail-pill[data-state=""]      { background: rgba(100, 116, 139, 0.15); color: #475569; }
    .avail-pill:disabled { opacity: 0.5; cursor: not-allowed; }
 
    .mat-table th { border-bottom: 2px solid var(--border); }
    .mat-table input { width: 90px; margin: 0; padding: 8px; }
    .warn { color: #991b1b; font-weight: bold; }
    @media (max-width: 600px) {
      main { padding: 16px; }
      header { padding: 16px; }
    }
  </style>
</head>

<body>
  <header>
    <h1>Industrial Manager</h1>
    <button id="logoutBtn" class="secondary" hidden>
      Cerrar sesión
    </button>
  </header>

  <main>
    <section id="loginView" class="card login">
      <h2>Iniciar sesión</h2>
      <p class="muted">Ingresa con tu cuenta de la empresa.</p>

      <form id="loginForm">
        <label for="email">Correo electrónico</label>
        <input
          id="email"
          type="email"
          required
          autocomplete="username"
        />

        <label for="password">Contraseña</label>
        <input
          id="password"
          type="password"
          required
          autocomplete="current-password"
        />

        <button id="loginBtn" type="submit" style="width:100%">
          Entrar
        </button>
      </form>

      <p id="message" role="status" aria-live="polite"></p>
    </section>

    <section id="appView" hidden>
      <h2>Dashboard</h2>
      <p id="welcome" class="muted"></p>

      <div class="card">
        <h3>Mi perfil</h3>
        <p><strong>Nombre:</strong> <span id="employeeName">—</span></p>
        <p><strong>Puesto:</strong> <span id="employeeRole">—</span></p>
        <p><strong>Código:</strong> <span id="employeeCode">—</span></p>
        <p><strong>Correo:</strong> <span id="employeeEmail">—</span></p>
      </div>

      <nav class="nav" aria-label="Módulos">
        <button class="active" data-page="projects">Proyectos</button>
        <button data-page="drawings">Planos</button>
        <button data-page="materials">Materiales</button>
        <button data-page="movements">Movimientos</button>
        <button data-page="transport">Transporte</button>
        <button data-page="machinery">Maquinaria</button>
      </nav>

      <section id="projectsPage">
        <div class="grid">
          <div class="card">
            <div class="muted">Proyectos</div>
            <div id="totalProjects" class="metric">0</div>
          </div>

          <div class="card">
            <div class="muted">Atrasados</div>
            <div id="overdueProjects" class="metric">0</div>
          </div>

          <div class="card">
            <div class="muted">Requieren atención</div>
            <div id="warningProjects" class="metric">0</div>
          </div>

          <div class="card">
            <div class="muted">Al corriente</div>
            <div id="onTrackProjects" class="metric">0</div>
          </div>
        </div>

        <div class="card">
           <div style="display:flex;justify-content:space-between;
                      align-items:center;gap:12px;flex-wrap:wrap">
            <h3>Proyectos actuales</h3>
            <div style="display:flex;gap:8px;flex-wrap:wrap">
              <button id="newProjectBtn" style="background:#16a34a">➕ Nuevo proyecto</button>
              <button id="refreshBtn">Actualizar</button>
            </div>
          </div>
          <div id="newProjectBox" hidden></div>
          </div>

          <p id="projectMessage" class="muted">Cargando proyectos...</p>
          <div id="projectList"></div>
        </div>
      </section>

      <section id="otherPage" class="card" hidden>
        <h2 id="otherTitle"></h2>
        <p id="otherDescription" class="muted"></p>
        <p id="moduleMessage" class="muted"></p>
        <div id="moduleContent"></div>
      </section>
    </section>
  </main>

  <script>
    
    // 1. Configuración de Supabase.
    const SUPABASE_URL =
      "https://hyxhrlsutaanulvpycid.supabase.co";

    const SUPABASE_ANON_KEY = "sb_publishable_gCZisdiEzJsXdpmg1RZZ5Q_3-LYG4hg";

    const db = window.supabase.createClient(
      SUPABASE_URL,
      SUPABASE_ANON_KEY
    );

    const $ = (id) => document.getElementById(id);

    // Orden alfabético en español (ignora mayúsculas y acentos, entiende números)
    const collator = new Intl.Collator("es", { numeric: true, sensitivity: "base" });
 
    function sortBy(rows, ...keys) {
      return [...rows].sort((a, b) => {
        for (const k of keys) {
          const x = String(a[k] ?? "").trim();
          const y = String(b[k] ?? "").trim();
          if (!x && y) return 1;      // los vacíos van al final
          if (x && !y) return -1;
          const c = collator.compare(x, y);
          if (c !== 0) return c;
        }
        return 0;
      });
    }

    let currentUser = null;
    let currentEmployee = null;
    let openProjects = [];

    const moduleInfo = {
      drawings: {
        title: "Planos técnicos",
        description:
          "Aquí conectaremos los planos asociados a cada proyecto."
      },
      materials: {
        title: "Materiales para hornos",
        description:
          "Aquí conectaremos materiales, calidad, proveedores, precios y plazos."
      },
      movements: {
        title: "Movimientos",
        description: "Historial de entradas y salidas de material por obra."
      },
      transport: {
        title: "Transporte",
        description:
          "Aquí conectaremos las empresas de transporte, vehículos y tarifas."
      },
      machinery: {
        title: "Maquinaria pesada",
        description:
          "Aquí conectaremos maquinaria, proveedores, alquileres y proyectos."
      },

    };

    // 2. Mostrar la pantalla de login.
    function showLogin(message = "") {
      $("loginView").hidden = false;
      $("appView").hidden = true;
      $("logoutBtn").hidden = true;
      $("message").textContent = message;

      currentUser = null;
      currentEmployee = null;
    }

    // 3. Obtener el perfil del empleado autenticado.
    async function loadEmployeeProfile(userId) {
      const { data: employee, error } = await db
        .from("employees")
        .select(`
          id,
          auth_user_id,
          employee_code,
          first_name,
          last_name,
          email,
          job_title
        `)
        .eq("auth_user_id", userId)
        .maybeSingle();

      if (error) {
        throw new Error(
          "No se pudo consultar el perfil del empleado: " +
          error.message
        );
      }

      if (!employee) {
        throw new Error(
          "Tu cuenta inició sesión, pero no tiene un perfil " +
          "asociado en employees. Comprueba auth_user_id."
        );
      }

      return employee;
    }

    // 4. Mostrar el perfil y entrar al dashboard.
    function showApp(user, employee) {
      currentUser = user;
      currentEmployee = employee;

      const fullName = [
        employee.first_name,
        employee.last_name
      ].filter(Boolean).join(" ").trim();

      const displayName =
        fullName || user.email || "Empleado";

      $("welcome").textContent =
        "Bienvenido, " + displayName;

      $("employeeName").textContent = displayName;
      $("employeeRole").textContent =
        employee.job_title || "Por asignar";
      $("employeeCode").textContent =
        employee.employee_code || "Sin código";
      $("employeeEmail").textContent =
        employee.email || user.email || "Sin correo";

      $("loginView").hidden = true;
      $("appView").hidden = false;
      $("logoutBtn").hidden = false;
      $("message").textContent = "";
    }

    // 5. Cargar perfil y solo entonces abrir el dashboard.
    async function enterApplication(user) {
      try {
        const employee = await loadEmployeeProfile(user.id);

        showApp(user, employee);
        await loadProjects();
      } catch (error) {
        console.error("Error de perfil:", error);

        // Evitar dejar una sesión sin perfil en una pantalla
        // que parece haber iniciado correctamente.
        await db.auth.signOut();

        showLogin(error.message);
        throw error;
      }
    }

    // 6. Iniciar sesión.
    $("loginForm").addEventListener("submit", async (event) => {
      event.preventDefault();

      const button = $("loginBtn");
      button.disabled = true;
      $("message").textContent = "";

      try {
        const { data, error } = await db.auth.signInWithPassword({
          email: $("email").value.trim(),
          password: $("password").value
        });

        if (error) {
          throw error;
        }

        await enterApplication(data.user);
      } catch (error) {
        console.error("Error al iniciar sesión:", error);

        if (!currentUser) {
          showLogin("No se pudo iniciar sesión: " + error.message);
        }
      } finally {
        button.disabled = false;
      }
    });

    // 7. Cerrar sesión.
    $("logoutBtn").addEventListener("click", async () => {
      const button = $("logoutBtn");
      button.disabled = true;

      try {
        const { error } = await db.auth.signOut();

        if (error) {
          throw error;
        }

        showLogin();
        $("password").value = "";
      } catch (error) {
        alert("No se pudo cerrar sesión: " + error.message);
      } finally {
        button.disabled = false;
      }
    });

    // 8. Clasificar el estado del proyecto.
    function getProjectStatus(project, publishedUpdate) {
      const today = new Date();
      today.setHours(0, 0, 0, 0);

      const dueDate = project.due_date
        ? new Date(project.due_date + "T00:00:00")
        : null;

      const progress = Number(
        project.progress_percentage ?? 0
      );

      if (progress >= 100) {
        return { type: "green", label: "Completado" };
      }

      if (dueDate && dueDate < today) {
        return { type: "red", label: "Atrasado" };
      }

      const daysLeft = dueDate
        ? Math.round((dueDate - today) / 86400000)
        : Infinity;

      if (
        dueDate &&
        daysLeft >= 0 &&
        daysLeft <= 2 &&
        !publishedUpdate
      ) {
        return {
          type: "yellow",
          label: "Requiere atención"
        };
      }

      return { type: "green", label: "Al corriente" };
    }

    // 9. Cargar proyectos desde Supabase.
    async function loadProjects() {
      $("projectMessage").textContent = "Cargando proyectos...";
      $("projectList").replaceChildren();

      try {
        const { data: projects, error } = await db
          .from("projects")
          .select("*")
          .order("due_date", { ascending: true });

        if (error) throw error;

        const { data: updates, error: updatesError } = await db
          .from("project_updates")
          .select("project_id, published_at")
          .not("published_at", "is", null);

        if (updatesError) throw updatesError;

        const publishedProjectIds = new Set(
          updates.map(update => String(update.project_id))
        );

        const counts = { red: 0, yellow: 0, green: 0 };

        $("totalProjects").textContent = projects.length;

        if (projects.length === 0) {
          $("projectMessage").textContent =
            "No hay proyectos visibles para esta cuenta.";

          updateCounts(counts);
          return;
        }

        $("projectMessage").textContent = "";

        for (const project of sortBy(projects, "name")) {
          const isPublished = publishedProjectIds.has(
            String(project.id)
          );

          const status = getProjectStatus(
            project,
            isPublished
          );

          counts[status.type]++;

          const progress = Math.max(
            0,
            Math.min(
              100,
              Number(project.progress_percentage ?? 0)
            )
          );

          const article = document.createElement("article");
          article.className = "project " + status.type;

          const title = document.createElement("h3");
          title.textContent =
            project.name || "Proyecto sin nombre";

          const badge = document.createElement("span");
          badge.className = "status";
          badge.textContent = status.label;

          const description = document.createElement("p");
          description.className = "muted";
          description.textContent =
            project.description || "Sin descripción";

          const due = document.createElement("p");
          due.textContent =
            "Entrega: " + (project.due_date || "Sin fecha");

          const progressText = document.createElement("p");
          progressText.textContent = "Avance: " + progress + "%";

          const progressBar = document.createElement("div");
          progressBar.className = "progress";

          const progressFill = document.createElement("div");
          progressFill.style.width = progress + "%";

          progressBar.appendChild(progressFill);

          article.append(
            title,
            badge,
            description,
            due,
            progressText,
            progressBar,
            buildProgressControls(project, progress)
          );

          $("projectList").appendChild(article);
        }

        updateCounts(counts);
      } catch (error) {
        console.error("Error al cargar proyectos:", error);
        $("projectMessage").textContent =
          "Error al consultar proyectos: " + error.message;
      }
    }

 // Fecha de hoy en formato AAAA-MM-DD (hora local)
    const todayISO = () =>
      new Date(Date.now() - new Date().getTimezoneOffset() * 60000)
        .toISOString().slice(0, 10);
 
    function labeled(text, el, required) {
      const lab = document.createElement("label");
      lab.textContent = text + (required ? " *" : "");
      el.required = !!required;
      lab.appendChild(el);
      return lab;
    }
 
    function renderNewProjectForm() {
      const box = $("newProjectBox");
      box.replaceChildren();
 
      const form = document.createElement("form");
      form.className = "mat-form";
      form.style.cssText =
        "margin:16px 0 24px;padding:18px;border:1px solid var(--border);" +
        "border-radius:12px;background:#f8fafc;";
 
      const title = document.createElement("h3");
      title.className = "full";
      title.style.margin = "0";
      title.textContent = "Nuevo proyecto";
 
      const nameIn = Object.assign(document.createElement("input"), { type: "text" });
      const descIn = Object.assign(document.createElement("input"), { type: "text" });
      const dueIn = Object.assign(document.createElement("input"), { type: "date", min: todayISO() });
 
      // ----- Fechas importantes (mínimo 2) -----
      const msTitle = document.createElement("h4");
      msTitle.className = "full";
      msTitle.style.margin = "8px 0 0";
      msTitle.textContent = "Fechas importantes (mínimo 2)";
 
      const msHelp = document.createElement("p");
      msHelp.className = "full muted";
      msHelp.style.margin = "0";
      msHelp.textContent =
        "En cada fecha indica qué debe estar hecho y qué porcentaje del proyecto " +
        "debe llevarse completado en ese punto (por ejemplo 30 %, luego 70 %).";
 
      const msBox = document.createElement("div");
      msBox.className = "full";
      msBox.style.cssText = "display:grid;gap:12px;";
 
      const rows = [];
 
      function addRow() {
        const el = document.createElement("div");
        el.className = "mat-form";
        el.style.cssText =
          "margin:0;padding:12px;border:1px solid var(--border);" +
          "border-radius:10px;background:white;";
 
        const d = Object.assign(document.createElement("input"), { type: "date", min: todayISO() });
        const t = Object.assign(document.createElement("input"), { type: "text" });
        const p = Object.assign(document.createElement("input"), {
          type: "number", min: "1", max: "100", step: "any"
        });
 
        const rm = document.createElement("button");
        rm.type = "button";
        rm.className = "secondary";
        rm.textContent = "Quitar";
        rm.style.alignSelf = "end";
        rm.hidden = rows.length < 2;          // las dos primeras no se pueden quitar
 
        const row = { el, d, t, p };
        rm.addEventListener("click", () => {
          if (rows.length <= 2) return;
          rows.splice(rows.indexOf(row), 1);
          el.remove();
        });
 
        el.append(
          labeled("Fecha", d, true),
          labeled("¿Qué debe estar hecho en esa fecha?", t, true),
          labeled("% del proyecto completado en ese punto", p, true),
          rm
        );
        msBox.appendChild(el);
        rows.push(row);
      }
 
      addRow();
      addRow();
 
      const addBtn = document.createElement("button");
      addBtn.type = "button";
      addBtn.className = "secondary";
      addBtn.textContent = "➕ Agregar fecha importante";
      addBtn.style.justifySelf = "start";
      addBtn.addEventListener("click", addRow);
 
      // ----- Botones -----
      const save = document.createElement("button");
      save.type = "submit";
      save.textContent = "Crear proyecto";
      save.style.background = "#16a34a";
 
      const cancel = document.createElement("button");
      cancel.type = "button";
      cancel.className = "secondary";
      cancel.textContent = "Cancelar";
      cancel.style.marginLeft = "8px";
      cancel.addEventListener("click", () => { box.hidden = true; });
 
      const status = document.createElement("p");
      status.setAttribute("role", "status");
 
      const foot = document.createElement("div");
      foot.className = "full";
      foot.append(save, cancel, status);
 
      form.append(
        title,
        labeled("Nombre del proyecto", nameIn, true),
        labeled("Descripción", descIn),
        labeled("Fecha de entrega", dueIn, true),
        msTitle, msHelp, msBox, addBtn, foot
      );
 
      form.addEventListener("submit", async (event) => {
        event.preventDefault();
        status.style.color = "#b91c1c";
        status.textContent = "";
 
        try {
          const items = rows.map(r => ({
            date: r.d.value,
            task: r.t.value.trim(),
            percent: Number(r.p.value)
          }));
 
          if (!nameIn.value.trim()) throw new Error("Escribe el nombre del proyecto.");
          if (!dueIn.value) throw new Error("Falta la fecha de entrega.");
          if (items.length < 2) throw new Error("Agrega al menos 2 fechas importantes.");
 
          items.forEach(i => {
            if (!i.date || !i.task || !(i.percent > 0 && i.percent <= 100)) {
              throw new Error("Completa la fecha, la tarea y el porcentaje (1 a 100) de cada fecha importante.");
            }
            if (i.date < todayISO() || i.date > dueIn.value) {
              throw new Error("Cada fecha importante debe estar entre hoy y la fecha de entrega.");
            }
          });
 
          const sorted = [...items].sort((a, b) => a.date.localeCompare(b.date));
          for (let i = 1; i < sorted.length; i++) {
            if (sorted[i].percent <= sorted[i - 1].percent) {
              throw new Error("Los porcentajes deben ir subiendo a medida que avanzan las fechas.");
            }
          }
 
          save.disabled = true;
          status.style.color = "#667085";
          status.textContent = "Creando proyecto...";
 
          const { error } = await db.rpc("create_project", {
            p_name: nameIn.value.trim(),
            p_description: descIn.value.trim() || null,
            p_due_date: dueIn.value,
            p_milestones: items
          });
          if (error) throw error;
 
          box.hidden = true;
          await loadProjects();
        } catch (error) {
          console.error("Error al crear proyecto:", error);

        foot.className = "full";

        form.append(l1, preview, l2, foot);
 
        // Vista previa de la suma: 50% + 20% => 70%
        pct.addEventListener("input", () => {
          const v = Number(pct.value);
          preview.textContent = v > 0
            ? "Llevas " + current + "% → quedará en " + (Math.round((current + v) * 100) / 100) + "%"
            : "Llevas " + current + "%. Faltan " + remaining + "%.";
        });

          if (v > remaining) { status.textContent = "Solo faltan " + remaining + "% para llegar al 100%."; return; }
          if (text.length < 5) { status.textContent = "Describe qué hiciste (mínimo 5 caracteres)."; return; }

          status.style.color = "#667085";
          status.textContent = "Guardando...";

            const { error } = await db.rpc("add_project_progress", {
              p_project_id: String(project.id),
              p_percent: v,
              p_description: text
            });
            if (error) throw error;
            await loadProjects();       // recarga: la barra ya muestra el nuevo total
          } catch (error) {
            console.error("Error al actualizar avance:", error);
            status.style.color = "#b91c1c";
            status.textContent = "No se guardó: " + error.message;
            btn.disabled = false;
          }

    // Crear una tabla HTML a partir de los registros recibidos.

    async function loadMachinery() {

    // Crea el selector de disponibilidad y el campo de ubicación de una máquina.
    function buildMachineryControls(m) {
      const sel = document.createElement("select");
      sel.className = "avail-pill";
      [["", "Sin definir"], ["true", "Disponible"], ["false", "No disponible"]]
        .forEach(([v, t]) => {
          const o = document.createElement("option");
          o.value = v;
          o.textContent = t;
          sel.appendChild(o);
        });
 
      const loc = document.createElement("input");
      loc.type = "text";
      loc.placeholder = "¿Dónde está ahora mismo?";
      loc.value = m.current_location || "";
      loc.style.cssText = "margin:0;min-width:220px;";
 
      // Sin ubicación escrita, la disponibilidad queda bloqueada.
      const paint = () => {
        sel.value = m.is_available === true ? "true"
                  : m.is_available === false ? "false" : "";
        sel.dataset.state = sel.value;
        sel.disabled = !loc.value.trim();
        sel.title = sel.disabled ? "Escribe primero dónde está la máquina" : "";
      };
 
      loc.addEventListener("input", paint);
 
      // Guardar la ubicación al salir del campo (o pulsar Enter)
      loc.addEventListener("change", async () => {
        const place = loc.value.trim();
        if (!place) { paint(); return; }                 // no se guarda vacía
        if (place === (m.current_location || "")) return;
 
        loc.disabled = true;
        const { error } = await db.from("machinery")
          .update({ current_location: place }).eq("id", m.id);
        loc.disabled = false;
 
        if (error) {
          alert("No se pudo guardar la ubicación: " + error.message);
          loc.value = m.current_location || "";
        } else {
          m.current_location = place;
        }
        paint();
      });
 
      // Guardar disponibilidad + ubicación actual en un solo movimiento
      sel.addEventListener("change", async () => {
        const place = loc.value.trim();
        if (!place) { paint(); return; }
 
        const value = sel.value === "" ? null : sel.value === "true";
        sel.disabled = true;
 
        const { error } = await db.from("machinery")
          .update({ is_available: value, current_location: place })
          .eq("id", m.id);
 
        if (error) {
          alert("No se pudo guardar la disponibilidad: " + error.message);
        } else {
          m.is_available = value;
          m.current_location = place;
        }
        paint();
      });
 
      paint();
      return [sel, loc];
    }
 
    // Dibuja el buscador y la tabla de maquinaria.
    function renderMachinery() {
      const content = $("moduleContent");
      content.replaceChildren();
 
      const search = document.createElement("input");
      search.type = "search";

      const count = document.createElement("p");

      const holder = document.createElement("div");
      content.append(search, count, holder);
 
      const draw = () => {
        const terms = foldTxt(search.value).split(/\s+/).filter(Boolean);
 
        const shown = machineryRows.filter(m => {
          const hay = foldTxt([
            m.machinery_code, m.name, m.category, m.brand,
            m.current_location, machAvailLabel(m.is_available)
          ].join(" "));
          return terms.every(t => hay.includes(t));
        });
 
        count.textContent = "Mostrando " + shown.length + " de " + machineryRows.length;
        holder.replaceChildren();
 
        if (shown.length === 0) {
          holder.textContent = "Ninguna máquina coincide con el filtro.";
          return;
        }
 
        holder.appendChild(makeTable(
          ["Código", "Maquinaria", "Categoría", "Marca", "Disponible", "Ubicación actual"],
          shown.map(m => {
            const [sel, loc] = buildMachineryControls(m);
            return [m.machinery_code, m.name, m.category, m.brand, sel, loc];
          })
        ));
      };
 
      search.addEventListener("input", draw);
      draw();
    }

    // Etiqueta + campo (texto, número, fecha o lista) para el formulario de entradas
    function entryField([key, label, type, required], store) {
      const lab = document.createElement("label");
      lab.textContent = label + (required ? " *" : "");
      let el;
      if (type === "select") {
        el = document.createElement("select");
        ["OK", "REVISAR"].forEach(v => {
          const o = document.createElement("option");
          o.value = o.textContent = v;
          el.appendChild(o);
        });
      } else {
        el = document.createElement("input");
        el.type = type;
        if (type === "number") { el.min = "0"; el.step = "any"; }
      }
      el.required = !!required;
      store[key] = el;
      lab.appendChild(el);
      return lab;
    }
 
    function selectLabel(text, el) {
      const lab = document.createElement("label");
      lab.textContent = text;
      lab.appendChild(el);
      return lab;
    }
 
    function option(value, text) {
      const o = document.createElement("option");
      o.value = value;
      o.textContent = text;
      return o;
    }
 
    function renderEntryForm(body, afterSave) {
      const title = document.createElement("h3");
      title.textContent = "Registrar entrada de material";
 
      const form = document.createElement("form");
      form.className = "mat-form";
 
      // 1) Familia y origen de la entrada
      const famSel = document.createElement("select");
      Object.entries(MAT).forEach(([k, f]) => famSel.appendChild(option(k, f.label)));
 
      const modeSel = document.createElement("select");
      modeSel.append(
        option("DIRECTA", "Va directo a una obra (se usa automáticamente)"),
        option("SOBRANTE", "Es sobrante de una obra (vuelve a disponible)"),
        option("GENERAL", "Ingreso general al almacén (compra o reposición)")
      );
 
      const projSel = document.createElement("select");
      projSel.appendChild(option("", "Selecciona la obra *"));
      openProjects.forEach(p => projSel.appendChild(option(String(p.id), p.name || "Proyecto sin nombre")));
 
      // 2) Material existente o nuevo
      const matMode = document.createElement("select");
      matMode.append(option("EXISTENTE", "Material que ya existe"), option("NUEVO", "Material nuevo"));
      const matSel = document.createElement("select");
 
      const famL = selectLabel("Familia *", famSel);
      const modeL = selectLabel("¿De dónde viene esta entrada? *", modeSel);
      const projL = selectLabel("Obra *", projSel);
      const matModeL = selectLabel("Material *", matMode);
      const matSelL = selectLabel("Elige el material *", matSel);
      matSelL.className = "full";
 
      // 3) Datos del material nuevo (se reconstruyen al cambiar de familia)
      const newBox = document.createElement("div");
      newBox.className = "full mat-form";
      newBox.style.marginTop = "0";
      let newInputs = {};
 
      // 4) Cantidad, lote y comentario
      const qty = document.createElement("input");
      qty.type = "number"; qty.min = "0"; qty.step = "any"; qty.required = true;
      const lot = document.createElement("input");
      lot.type = "text";
      const comment = document.createElement("input");
      comment.type = "text";
 
      const qtyL = selectLabel("Cantidad que entra *", qty);
      const lotL = selectLabel("Lote", lot);
      const commentL = selectLabel("Comentario / proveedor", comment);
 
      const btn = document.createElement("button");
      btn.type = "submit";
      btn.textContent = "Registrar entrada";
      btn.style.background = "#16a34a";
      const who = document.createElement("p");
      who.className = "muted";
      who.textContent = "Registrado por: " + whoAmI();
      const status = document.createElement("p");
      status.setAttribute("role", "status");
      const foot = document.createElement("div");
      foot.className = "full";
      foot.append(btn, who, status);
 
      form.append(famL, modeL, projL, matModeL, matSelL, newBox, qtyL, lotL, commentL, foot);
 
      // Reconstruye lo que depende de la familia y de las opciones elegidas
      function rebuild() {
        const fam = famSel.value;
        const isNew = matMode.value === "NUEVO";
        const mode = modeSel.value;
 
        projL.hidden = mode === "GENERAL";
        commentL.hidden = mode !== "GENERAL";
        matSelL.hidden = isNew;
        newBox.hidden = !isNew;
        projSel.required = mode !== "GENERAL";
        matSel.required = !isNew;
 
        // Un sobrante siempre es de un material que ya existe
        const newOpt = [...matMode.options].find(o => o.value === "NUEVO");
        newOpt.disabled = mode === "SOBRANTE";
        if (mode === "SOBRANTE" && isNew) { matMode.value = "EXISTENTE"; return rebuild(); }
 
        matSel.replaceChildren(option("", "Selecciona..."));
        MAT[fam].rows.forEach(r =>
          matSel.appendChild(option(r.id, r.pr_code + " — " + (MAT[fam].name(r) ?? ""))));
 
        newBox.replaceChildren();
        newInputs = {};
        MAT_FORM[fam].fields
          .filter(([k]) => !["quantity", "available", "reserved"].includes(k))
          .forEach(f => newBox.appendChild(entryField(f, newInputs)));
        Object.values(newInputs).forEach(el => { el.required = el.required && isNew; });
      }
 
      famSel.addEventListener("change", rebuild);
      modeSel.addEventListener("change", rebuild);
      matMode.addEventListener("change", rebuild);
      rebuild();
 
      form.addEventListener("submit", async (event) => {
        event.preventDefault();
        btn.disabled = true;
        status.style.color = "#b91c1c";
        status.textContent = "";
 
        try {
          const fam = famSel.value, mode = modeSel.value;
          const q = Number(qty.value);
          if (!(q > 0)) throw new Error("La cantidad debe ser mayor que 0.");
          if (mode !== "GENERAL" && !projSel.value) throw new Error("Selecciona la obra.");
 
          let materialId = null, newRow = null;
 
          if (matMode.value === "EXISTENTE") {
            materialId = matSel.value;
            if (!materialId) throw new Error("Elige el material.");
          } else {
            newRow = {};
            MAT_FORM[fam].fields.forEach(([key, label, type, required]) => {
              if (!(key in newInputs)) return;
              const v = newInputs[key].value.trim();
              if (required && !v) throw new Error("Falta el campo: " + label);
              newRow[key] = v === "" ? null : (type === "number" ? Number(v) : v);
            });
 
            // Duplicados: aviso amable antes de enviar
            for (const f of Object.values(MAT)) {
              if (f.rows.some(r => normTxt(r.pr_code) === normTxt(newRow.pr_code))) {
                throw new Error("El código PR \"" + newRow.pr_code + "\" ya existe en " + f.label + ".");
              }
            }
            const nk = MAT_FORM[fam].nameKey;
            if (MAT[fam].rows.some(r => normTxt(r[nk]) === normTxt(newRow[nk]))) {
              throw new Error("Ya existe un material llamado \"" + newRow[nk] + "\" en " + MAT[fam].label + ".");
            }
            // La cantidad real la pone la entrada
            newRow.quantity = 0; newRow.available = 0; newRow.reserved = 0;
          }
 
          const { error } = await db.rpc("register_entry", {
            p_family: fam,
            p_material_id: materialId,
            p_new: newRow,
            p_qty: q,
            p_lot: lot.value.trim() || null,
            p_mode: mode,
            p_project_id: mode === "GENERAL" ? null : projSel.value,
            p_comment: comment.value.trim() || null
          });
 
          if (error) {
            if (error.code === "23505") {
              throw new Error("Ese código PR o nombre ya existe en la base de datos.");
            }
            throw error;
          }
 
          await fetchMaterialRows();
          afterSave("✅ Entrada registrada.");
        } catch (error) {
          console.error("Error al registrar entrada:", error);
          status.textContent = error.message;
          btn.disabled = false;
        }
      });
 
      body.append(title, form);
    }
 
const DRAW_EXT = ["pdf", "dwg", "dxf", "png", "jpg", "jpeg", "xlsx", "docx"];
    const DRAW_MAX = 50 * 1024 * 1024;   // 50 MB

    async function loadDrawings() {

      $("moduleMessage").textContent = "";
      content.replaceChildren();
 
      // ----- Formulario de subida -----
      const form = document.createElement("form");
      form.className = "mat-form";
 
      const field = (label, el, required) => {
        const l = document.createElement("label");
        l.textContent = label + (required ? " *" : "");
        el.required = !!required;
        l.appendChild(el);
        form.appendChild(l);
        return el;
      };

        Object.assign(document.createElement("input"), { type: "text" }), true);

        Object.assign(document.createElement("input"), { type: "text" }));

        Object.assign(document.createElement("input"), {
          type: "file", accept: "." + DRAW_EXT.join(",.")
        }), true);

      btn.type = "submit";
      btn.textContent = "Subir plano";
      const status = document.createElement("p");
      status.setAttribute("role", "status");
      const foot = document.createElement("div");
      foot.className = "full";
      foot.append(btn, status);
      form.appendChild(foot);
 
      const heading = document.createElement("h3");
      heading.textContent = "Planos guardados";
      heading.style.marginTop = "28px";
      const list = document.createElement("div");
 
      content.append(form, heading, list);
 
      // ----- Lista de planos -----
      async function refresh() {
        list.textContent = "Cargando planos...";
        const { data, error } = await db
          .from("drawing_files")
          .select("*")
          .order("uploaded_at", { ascending: false });
 
        if (error) {
          list.textContent = "No se pudieron cargar los planos: " + error.message;
          return;
        }
        if (!data || data.length === 0) {
          list.textContent = "Aún no hay planos subidos.";
          return;
        }
 
        list.replaceChildren(makeTable(
          ["Título", "Descripción", "Archivo", "Tamaño", "Subido", ""],
          sortBy(data, "title").map(d => {
            const open = document.createElement("button");
            open.type = "button";
            open.textContent = "Abrir";
            open.addEventListener("click", async () => {
              // Se abre la pestaña antes del await para que no la bloquee el navegador
              const w = window.open("about:blank", "_blank");
              const { data: signed, error: err } = await db.storage
                .from("planos").createSignedUrl(d.file_path, 120);
              if (err) {
                if (w) w.close();
                alert("No se pudo abrir el archivo: " + err.message);
                return;
              }
              if (w) w.location.href = signed.signedUrl;
              else window.open(signed.signedUrl, "_blank");
            });
 
            return [
              d.title, d.description, d.file_name,
              d.size_bytes ? fmtSize(d.size_bytes) : "—",

    async function loadTransport() {
      const content = $("moduleContent");
      const message = $("moduleMessage");
      message.textContent = "Cargando transporte...";
      content.replaceChildren();
 
      let rows = [];
      try {
        const { data, error } = await db.from("transport_companies").select("*");
        if (error) throw error;
        rows = sortBy(data || [], "name");
      } catch (error) {
        console.error("Error al cargar transporte:", error);
        message.textContent = "Error al consultar transport_companies: " + error.message;
        return;
      }
      message.textContent = "";
 
      // Sub pestañas: Listado / Agregar
      const tabs = document.createElement("div");
      tabs.className = "nav";
      const body = document.createElement("div");
      content.append(tabs, body);
 
      const tabBtns = {};
      [["list", "Listado"], ["add", "➕ Agregar transporte"]].forEach(([k, label]) => {
        const b = document.createElement("button");
        b.textContent = label;
        b.addEventListener("click", () => show(k));
        tabs.appendChild(b);
        tabBtns[k] = b;
      });
 
      function show(tab) {
        Object.entries(tabBtns).forEach(([k, b]) => b.classList.toggle("active", k === tab));
        body.replaceChildren();
        if (tab === "add") renderAdd(); else renderList();
      }
 
      function renderList() {
        if (rows.length === 0) {
          body.textContent = "No hay empresas de transporte registradas.";
          return;
        }
        const keys = Object.keys(rows[0]).filter(k => k !== "id");
        body.appendChild(makeTable(
          keys.map(k => k.replaceAll("_", " ")),
          rows.map(r => keys.map(k => {
            const v = r[k];
            return v !== null && typeof v === "object" ? JSON.stringify(v) : v;
          }))
        ));
      }
 
      function renderAdd() {
        const title = document.createElement("h3");
        title.textContent = "Agregar transporte";
 
        const form = document.createElement("form");
        form.className = "mat-form";
        const inputs = {};
 
        TRANSPORT_FIELDS.forEach(([key, label, type, required]) => {
          const lab = document.createElement("label");
          lab.textContent = label + (required ? " *" : "");
          const el = document.createElement("input");
          el.type = type;
          el.required = !!required;
          inputs[key] = el;
          lab.appendChild(el);
          form.appendChild(lab);
        });
 
        const btn = document.createElement("button");
        btn.type = "submit";
        btn.textContent = "Guardar transporte";
        const status = document.createElement("p");
        status.setAttribute("role", "status");
        const foot = document.createElement("div");
        foot.className = "full";
        foot.append(btn, status);
        form.appendChild(foot);
 
        form.addEventListener("submit", async (event) => {
          event.preventDefault();
          btn.disabled = true;
          status.style.color = "#b91c1c";
          status.textContent = "";
 
          try {
            const row = {};
            TRANSPORT_FIELDS.forEach(([key, label, , required]) => {
              const v = inputs[key].value.trim();
              if (required && !v) throw new Error("Falta el campo: " + label);
              row[key] = v === "" ? null : v;
            });
 
            const { data, error } = await db
              .from("transport_companies").insert(row).select().single();
            if (error) throw error;
 
            rows = sortBy([...rows, data], "name");
            status.style.color = "#166534";
            status.textContent = "Transporte guardado correctamente.";
            form.reset();
          } catch (error) {
            console.error("Error al agregar transporte:", error);
            status.textContent = error.message;
          } finally {
            btn.disabled = false;
          }
        });
 
        body.append(title, form);
      }
 
      show("list");
    }
 
      // ----- Subir archivo -----
      form.addEventListener("submit", async (event) => {
        event.preventDefault();
        status.style.color = "#b91c1c";
        status.textContent = "";
 
        const file = fileIn.files[0];
        if (!file) return;
 
        const ext = (file.name.split(".").pop() || "").toLowerCase();
        if (!DRAW_EXT.includes(ext)) {
          status.textContent = "Formato no permitido. Usa: " + DRAW_EXT.join(", ") + ".";
          return;
        }
        if (file.size > DRAW_MAX) {
          status.textContent = "El archivo supera los 50 MB.";
          return;
        }
 
        btn.disabled = true;
        status.style.color = "#667085";
        status.textContent = "Subiendo...";
 
        // Nombre interno único: evita choques y caracteres raros. El nombre original se guarda aparte.
        const path = crypto.randomUUID() + "." + ext;
 
        try {
          const up = await db.storage.from("planos").upload(path, file, {
            contentType: file.type || "application/octet-stream",
            upsert: false
          });
          if (up.error) throw up.error;
 
          const ins = await db.from("drawing_files").insert({
            title: titleIn.value.trim(),
            description: descIn.value.trim() || null,
            file_path: path,
            file_name: file.name,
            mime_type: file.type || null,
            size_bytes: file.size
          });
 
          if (ins.error) {
            // Si falla el registro, se borra el archivo para no dejar huérfanos
            await db.storage.from("planos").remove([path]);
            throw ins.error;
          }
 
          status.style.color = "#166534";
          status.textContent = "Plano subido correctamente.";
          form.reset();
          await refresh();
        } catch (error) {
          console.error("Error al subir el plano:", error);
          status.style.color = "#b91c1c";
          status.textContent = "No se pudo subir: " + error.message;
        } finally {
          btn.disabled = false;
        }
      });
 
      await refresh();
    }

    // Selección del usuario: clave "familia:id" -> {family, code, name, qty, unit}
    const matSel = new Map();
 
    function monthsSince(dateStr) {
      if (!dateStr) return null;
      const a = new Date(dateStr + "T00:00:00"), n = new Date();
      return (n.getFullYear() - a.getFullYear()) * 12 +
             (n.getMonth() - a.getMonth()) - (n.getDate() < a.getDate() ? 1 : 0);
    }
 
    // Tabla genérica: cada celda puede ser texto o un nodo (por ejemplo un input).
    function makeTable(headers, rows) {
      const table = document.createElement("table");
      table.className = "mat-table";
      const hr = document.createElement("tr");
      headers.forEach(h => {
        const th = document.createElement("th");
        th.textContent = h;
        hr.appendChild(th);
      });
      const thead = document.createElement("thead");
      thead.appendChild(hr);
      const tbody = document.createElement("tbody");
      rows.forEach(cells => {
        const tr = document.createElement("tr");
        cells.forEach(v => {
          const td = document.createElement("td");
          if (v instanceof Node) td.appendChild(v);
          else td.textContent = v == null ? "—" : String(v);
          tr.appendChild(td);
        });
        tbody.appendChild(tr);
      });
      table.append(thead, tbody);
      const wrap = document.createElement("div");
      wrap.style.overflowX = "auto";
      wrap.appendChild(table);
      return wrap;
    }
 
    // Texto de búsqueda recordado por subpestaña
    const matSearch = {};
 
    // Minúsculas y sin acentos: "Hormigon" encuentra "Hormigón"
    const foldTxt = s => String(s ?? "")
      .normalize("NFD").replace(/[\u0300-\u036f]/g, "").toLowerCase();
 
    function renderMatTable(key) {
      const f = MAT[key], body = $("matBody");
      body.replaceChildren();
 
      if (!f.rows.length) {
        body.textContent = "No hay registros en " + f.table + ".";
        return;
      }
 
      // Construye una fila (celdas + campo "Cantidad a usar")
      const buildRow = (r) => {
        const id = key + ":" + r.id;
        const cells = f.cols.map(([k]) => {
          if (k === "status" && r.status === "REVISAR") {
            const s = document.createElement("span");
            s.className = "warn";
            s.textContent = "REVISAR";
            return s;
          }
          return r[k];
        });
 
        const inp = document.createElement("input");
        inp.type = "number";
        inp.min = "0";
        inp.max = String(f.avail(r) ?? 0);
        inp.step = "any";
        inp.value = matSel.has(id) ? matSel.get(id).qty : "";
        inp.addEventListener("input", () => {
          let v = Number(inp.value);
          if (!(v > 0)) { matSel.delete(id); return; }
          const max = Number(f.avail(r)) || 0;
          if (v > max) { v = max; inp.value = max; }   // no pasar de lo disponible
          if (v === 0) { matSel.delete(id); return; }
          matSel.set(id, {
            family: key, id: r.id, code: r.pr_code, name: f.name(r),
            qty: v, unit: r.unit || "ud", lot: matSel.get(id)?.lot || ""
          });
        });
        cells.push(inp);
        return cells;
      };
 
      // Buscador (se crea una sola vez para no perder el foco al escribir)
      const search = document.createElement("input");
      search.type = "search";
      search.placeholder = "Filtrar por código, nombre, tipo, fabricante...";
      search.value = matSearch[key] || "";
      search.style.cssText = "max-width:420px;margin:0 0 8px;";
 
      const count = document.createElement("p");
      count.className = "muted";
 
      const holder = document.createElement("div");
      body.append(search, count, holder);
 
      const headers = [...f.cols.map(c => c[1]), "Cantidad a usar"];
 
      // Filtra: todas las palabras escritas deben aparecer en alguna columna
      const draw = () => {
        const terms = foldTxt(search.value).split(/\s+/).filter(Boolean);
        const shown = f.rows.filter(r => {
          const hay = foldTxt(f.cols.map(([k]) => r[k]).join(" "));
          return terms.every(t => hay.includes(t));
        });
 
        count.textContent = "Mostrando " + shown.length + " de " + f.rows.length;
        holder.replaceChildren();
 
        if (shown.length === 0) {
          holder.textContent = "Ningún material coincide con el filtro.";
          return;
        }
        holder.appendChild(makeTable(headers, shown.map(buildRow)));
      };
 
      search.addEventListener("input", () => {
        matSearch[key] = search.value;
        draw();
      });
 
      draw();
    }

      save.addEventListener("click", async () => {

    // Calcula los campos derivados de una fila (se usa al cargar y al agregar).
    function prepMatRow(key, r) {
      return {
        ...r,
        age_months: monthsSince(r.manufacture_date),
        ...(key === "ceramic"
          ? { available: (Number(r.quantity) || 0) - (Number(r.reserved) || 0) }
          : {})
      };
    }
 
    const normTxt = s => String(s ?? "").trim().toLowerCase();
 
    function renderMatForm(family = "hormigon") {
      const body = $("matBody");
      body.replaceChildren();
 
      const title = document.createElement("h3");
      title.textContent = "Agregar material";
 
      const sel = document.createElement("select");
      sel.className = "mat-family";
      Object.entries(MAT).forEach(([k, f]) => {
        const o = document.createElement("option");
        o.value = k; o.textContent = f.label;
        sel.appendChild(o);
      });
      sel.value = family;
      sel.addEventListener("change", () => renderMatForm(sel.value));
 
      const cfg = MAT_FORM[family], fam = MAT[family];
      const form = document.createElement("form");
      form.className = "mat-form";
      const inputs = {};
 
      cfg.fields.forEach(([key, label, type, required]) => {
        const lab = document.createElement("label");
        lab.textContent = label + (required ? " *" : "");
        let el;
        if (type === "select") {
          el = document.createElement("select");
          ["OK", "REVISAR"].forEach(v => {
            const o = document.createElement("option");
            o.value = o.textContent = v;
            el.appendChild(o);
          });
        } else {
          el = document.createElement("input");
          el.type = type;
          if (type === "number") { el.min = "0"; el.step = "any"; }
        }
        el.required = !!required;
        inputs[key] = el;
        lab.appendChild(el);
        form.appendChild(lab);
      });
 
      const btn = document.createElement("button");
      btn.type = "submit";
      btn.textContent = "Guardar material";
      const msg = document.createElement("p");
      msg.setAttribute("role", "status");
      msg.className = "full";
      const foot = document.createElement("div");
      foot.className = "full";
      foot.append(btn, msg);
      form.appendChild(foot);
 
      form.addEventListener("submit", async (event) => {
        event.preventDefault();
        btn.disabled = true;
        msg.style.color = "#b91c1c";
        msg.textContent = "";
 
        try {
          // Armar la fila (vacío => null)
          const row = {};
          cfg.fields.forEach(([key, , type]) => {
            const v = inputs[key].value.trim();
            row[key] = v === "" ? null : (type === "number" ? Number(v) : v);
          });
 
          // Obligatorios (evita textos con solo espacios)
          cfg.fields.forEach(([key, label, , required]) => {
            if (required && row[key] == null) throw new Error("Falta el campo: " + label);
          });
 
          // Valores razonables
          if ("available" in row && row.available == null) row.available = row.quantity;
          if ("available" in row && row.available > row.quantity) {
            throw new Error("Lo disponible no puede ser mayor que la cantidad.");
          }
          if ("reserved" in row && row.reserved == null) row.reserved = 0;
          if ("reserved" in row && row.reserved > row.quantity) {
            throw new Error("Los reservados no pueden ser mayores que la cantidad.");
          }
 
          // Duplicados: aviso amable antes de enviar
          for (const [k, f] of Object.entries(MAT)) {
            if (f.rows.some(r => normTxt(r.pr_code) === normTxt(row.pr_code))) {
              throw new Error("El código PR \"" + row.pr_code + "\" ya existe en " + f.label + ".");
            }
          }
          if (fam.rows.some(r => normTxt(r[cfg.nameKey]) === normTxt(row[cfg.nameKey]))) {
            throw new Error("Ya existe un material llamado \"" + row[cfg.nameKey] + "\" en " + fam.label + ".");
          }
 
          // Guardar en Supabase
          const { data, error } = await db.from(fam.table).insert(row).select().single();
 
          if (error) {
            // 23505 = violación de unicidad (la base de datos es la protección final)
            if (error.code === "23505") {
              throw new Error("Ese código PR o nombre ya existe en la base de datos.");
            }
            throw error;
          }
 
          fam.rows = sortBy(
            [...fam.rows, prepMatRow(family, data)],
            cfg.nameKey, "pr_code"
          );
          msg.style.color = "#166534";
          msg.textContent = "Material guardado correctamente.";
          form.reset();
        } catch (error) {
          console.error("Error al agregar material:", error);
          msg.textContent = error.message;
        } finally {
          btn.disabled = false;
        }
      });
 
      body.append(title, sel, form);
    }
 
      function showMatTab(key) {
      document.querySelectorAll("#matTabs button").forEach(b =>
        b.classList.toggle("active", b.dataset.tab === key));
      if (key === "summary") renderMatSummary();
      else if (key === "add") renderMatForm();
      else renderMatTable(key);
    }
     if (key === "summary") renderMatSummary();
      else if (key === "add") renderMatForm();
      else renderMatTable(key);

         // Nombre de quien tiene la sesión iniciada (solo para mostrarlo; el registro real lo hace la base de datos)
    function whoAmI() {
      const n = [currentEmployee?.first_name, currentEmployee?.last_name].filter(Boolean).join(" ");
      return n || currentUser?.email || "—";
    }
 
    // Carga todas las filas de las 5 familias, ya ordenadas
    async function fetchMaterialRows() {
      await Promise.all(Object.entries(MAT).map(async ([key, f]) => {
        const { data, error } = await db.from(f.table).select("*");
        if (error) throw new Error(f.table + ": " + error.message);
        f.rows = sortBy(
          (data || []).map(r => prepMatRow(key, r)),
          MAT_FORM[key].nameKey, "pr_code"
        );
      }));
    }
 
    // Obras abiertas (menos de 100%), ordenadas por nombre
    
    async function fetchOpenProjects() {
      const { data, error } = await db
        .from("projects").select("id, name, progress_percentage");
      if (error) throw new Error("projects: " + error.message);
      openProjects = sortBy(
        (data || []).filter(p => Number(p.progress_percentage ?? 0) < 100), "name");
    }
 
    async function loadMaterials() {
      const content = $("moduleContent");
      content.replaceChildren();
      $("moduleMessage").textContent = "Cargando materiales...";
 
      try {
        await Promise.all([fetchMaterialRows(), fetchOpenProjects()]);
 
        $("moduleMessage").textContent = "";
 
        const tabs = document.createElement("div");
        tabs.className = "nav";
        tabs.id = "matTabs";
        [...Object.entries(MAT).map(([k, f]) => [k, f.label]),
          ["summary", "Resumen"], ["add", "➕ Agregar material"]]
          .forEach(([k, label]) => {
            const b = document.createElement("button");
            b.dataset.tab = k;
            b.textContent = label;
            b.addEventListener("click", () => showMatTab(k));
            tabs.appendChild(b);
          });
 
        const body = document.createElement("div");

      } catch (error) {

    // 12. Diagnóstico de conexión y permisos de Supabase.
    async function diagnosticarSupabase() {
      console.group("Diagnóstico de Industrial Manager");

      try {
        // Comprobar sesión actual.
        const { data: sessionData, error: sessionError } =
          await db.auth.getSession();

        if (sessionError) {
          console.error("Error de sesión:", sessionError);
        } else {
          console.log(
            "Sesión:",
            sessionData.session
              ? "Activa (" + sessionData.session.user.email + ")"
              : "No hay una sesión activa"
          );
        }

        // Comprobar acceso de lectura a las tablas.
        const tablas = [
          "employees",
          "projects",
          "project_updates",
          "drawings",
          "materials",
          "machinery"
        ];

        for (const tabla of tablas) {
          console.group("Tabla: " + tabla);

          try {
            const { data, error, count } = await db
              .from(tabla)
              .select("*", { count: "exact" })
              .limit(1);

            if (error) {
              console.error("❌ Error al consultar");
              console.error("Código:", error.code);
              console.error("Mensaje:", error.message);
              console.error("Detalles:", error.details);
              console.error("Sugerencia:", error.hint);
            } else {
              console.log("✅ Consulta correcta");
              console.log("Filas devueltas:", data.length);
              console.log("Total visible:", count);
              console.log("Datos de ejemplo:", data);
            }
          } catch (error) {
            console.error("Error inesperado:", error);
          }

          console.groupEnd();
        }
      } catch (error) {
        console.error("Falló el diagnóstico:", error);
      }

      console.groupEnd();
    }

    // Ejecutar el diagnóstico al iniciar la página.
    initialize();

    // Volver a diagnosticar cuando se inicia o restaura la sesión.
    db.auth.onAuthStateChange((event, session) => {
      if (
        event === "SIGNED_IN" ||
        event === "INITIAL_SESSION"
      ) {
        setTimeout(() => {
          diagnosticarSupabase();
        }, 0);
      }
    });
